title: Ashutosh Jha

# Used by jekyll-seo-tag and the site footer (keep concise).
description: >-
  PhD student in Machine Learning at the Institute of AI, TU Braunschweig. Machine learning
  for complex systems, causality, and causal and probabilistic representation learning.

# String form so the Minima footer shows your name (a hash would render as {"name"=>"…"}).
author: Ashutosh Jha

theme: minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# /journey/ is intentionally absent; the page still builds and is linked from the CV page.
header_pages:
  - index.md
  - publications.md
  - portfolio.md
  - about.md
  - contact.md

# Keep local working folders out of the build entirely. They are gitignored, so
# they never reach the GitHub Actions checkout, but excluding them also stops a
# local `jekyll build` from copying private files (e.g. a signature image) and
# LaTeX build artifacts into _site/.
# Re-listing Jekyll's own defaults: a custom `exclude` replaces them.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - my_cv/
  - mpi_is_contract/

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      image: /assets/profile.jpg

minima:
  skin: classic

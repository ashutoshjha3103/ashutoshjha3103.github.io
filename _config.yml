title: Ashutosh Jha

# Used by jekyll-seo-tag and the site footer (keep concise).
description: >-
  PhD student in Machine Learning at the Institute of AI, TU Braunschweig. Causal and
  probabilistic representation learning, identifiability, and optimal transport.

# String form so the Minima footer shows your name (a hash would render as {"name"=>"…"}).
author: Ashutosh Jha

theme: minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# /journey/ is intentionally absent — the page still builds and is linked from the CV page.
header_pages:
  - index.md
  - publications.md
  - portfolio.md
  - about.md
  - contact.md

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      image: /assets/profile.jpg

minima:
  skin: classic

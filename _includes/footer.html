<footer class="site-footer">
  <div class="wrapper footer-inner">
    <p class="footer-note">
      &copy; {{ site.time | date: "%Y" }} {{ site.author }}<span class="footer-sep" aria-hidden="true"> &middot; </span><span class="footer-updated">Last updated {{ site.time | date: "%B %Y" }}</span>
    </p>
    {% include social-icons.html %}
    <a class="back-to-top" href="#top">Back to top <span aria-hidden="true">&uarr;</span></a>
  </div>
</footer>

<script>
(function () {
  // Fade sections in as they scroll into view. Only elements below the fold are
  // hidden, and only when the visitor has not asked for reduced motion.
  if (!("IntersectionObserver" in window)) return;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  var targets = document.querySelectorAll(
    ".section-title, .interest-item, .news-item, .pub-item, .timeline-item, .project-card, .contact-item"
  );
  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        var el = entry.target;
        el.classList.add("is-visible");
        observer.unobserve(el);
        // Drop the helper classes once faded in so hover effects stay snappy.
        setTimeout(function () { el.classList.remove("reveal", "is-visible"); }, 600);
      }
    });
  }, { rootMargin: "0px 0px -8% 0px" });

  Array.prototype.forEach.call(targets, function (el) {
    if (el.getBoundingClientRect().top > window.innerHeight) {
      el.classList.add("reveal");
      observer.observe(el);
    }
  });
})();
</script>
